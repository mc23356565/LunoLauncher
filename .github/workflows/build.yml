name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/OpenLauncher/OpenLauncher.csproj -c Release -nologo

      - name: Hash
        id: hash
        shell: pwsh
        run: |
          $p = "src/OpenLauncher/bin/Release/LunoLauncher.exe"
          $h = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
          $kb = [math]::Round((Get-Item $p).Length / 1KB)
          "sha=$h" >> $env:GITHUB_OUTPUT
          "kb=$kb" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256 $h ($kb KB)"

      - uses: actions/upload-artifact@v4
        with:
          name: LunoLauncher-exe
          path: src/OpenLauncher/bin/Release/LunoLauncher.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/OpenLauncher/bin/Release/LunoLauncher.exe
          # 保留你在网页上写的发布说明，只把校验信息追加在后面
          append_body: true
          body: |
            ---

            **SHA-256:** `${{ steps.hash.outputs.sha }}`
            **Size:** ${{ steps.hash.outputs.kb }} KB

            Verify before running:

            ```
            Get-FileHash .\LunoLauncher.exe -Algorithm SHA256
            ```

            This build is not code-signed yet, so Windows SmartScreen may warn. Compare
            the hash above before running the file.
